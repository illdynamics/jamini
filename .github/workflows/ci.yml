name: CI

on: [push, pull_request]

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shell syntax (bash -n)
        run: |
          for f in jamini scripts/install.sh bin/jamini bin/jamini-entrypoint bin/jamini-healthcheck bin/jamini-print-config; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "FAIL: bash -n $f"; exit 1; }
          done
          echo "All shell syntax OK"

      - name: ShellCheck
        run: shellcheck jamini scripts/install.sh bin/jamini bin/jamini-entrypoint bin/jamini-healthcheck bin/jamini-print-config || true

      - name: Executable permissions
        run: |
          for f in jamini scripts/install.sh bin/jamini bin/jamini-entrypoint bin/jamini-healthcheck bin/jamini-print-config; do
            [ -f "$f" ] || continue
            test -x "$f" || { echo "FAIL: not executable — $f"; exit 1; }
          done
          echo "All executables OK"

      - name: VERSION consistency check
        run: |
          if [ -f VERSION ]; then
            VER=$(cat VERSION)
            echo "VERSION file: ${VER}"
            if ! echo "${VER}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: VERSION does not look like a semver tag (vX.Y.Z)"
              exit 1
            fi
            echo "VERSION format: OK"
          else
            echo "FAIL: VERSION file missing"
            exit 1
          fi

      - name: Secret scan
        run: |
          if git grep -n -E 'sk-[a-zA-Z0-9]{20,}' -- '*.sh' '*.ts' '*.js' '*.yml' '*.yaml' ':!gemini-cli/' ':!node_modules/' ':!bridge/node_modules/' 2>/dev/null; then
            echo "FAIL: potential API key in source files"
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Git whitespace
        run: git diff --check

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Install bridge deps
        run: cd bridge && npm ci
      - name: Build
        run: ./jamini build
      - name: Typecheck / Lint
        run: ./jamini lint
      - name: Test
        run: ./jamini test

  package:
    name: Package Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Build
        run: ./jamini build
      - name: Package dry-run
        run: npm pack --dry-run
      - name: Release hygiene
        run: npm run check:release-hygiene

  docker:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t jamini:ci .
      - name: Smoke — help
        run: docker run --rm jamini:ci --help
      - name: Smoke — version
        run: docker run --rm jamini:ci --version
      - name: Smoke — with key
        run: docker run --rm -e DEEPSEEK_API_KEY=sk-test-key jamini:ci --version
      - name: Smoke — gemini CLI available
        run: |
          docker run --rm jamini:ci gemini --version
          echo "Gemini CLI inside container: OK"
      - name: Smoke — bridge server starts
        run: |
          docker run --rm -d --name jamini-bridge-ci \
            --entrypoint node \
            -e DEEPSEEK_API_KEY=sk-test-key \
            -e JAMINI_BRIDGE_AUTO_START=1 \
            jamini:ci /opt/jamini/bridge/dist/server.js
          sleep 2
          docker exec jamini-bridge-ci curl -sf http://127.0.0.1:7654/health
          echo ""
          docker exec jamini-bridge-ci curl -sf http://127.0.0.1:7654/v1/models
          docker stop jamini-bridge-ci
      - name: Smoke — config generation
        run: |
          docker run --rm -e DEEPSEEK_API_KEY=sk-test-key jamini:ci node /opt/jamini/dist/cli.js --help | grep -q 'Jamini'
          echo "CLI config generation: OK"
      - name: Smoke — model catalog in container
        run: |
          docker run --rm --entrypoint cat jamini:ci /opt/jamini/config/model-catalog.json | grep -q 'v4-flash'
          echo "Model catalog present: OK"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [static, test, package, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Read tag from VERSION file
        run: |
          VERSION_IN_REPO=$(cat VERSION)
          echo "tag=${VERSION_IN_REPO}" >> "${GITHUB_ENV}"
          echo "Using VERSION file: ${VERSION_IN_REPO}"

      - name: Build archive
        run: |
          ARCHIVE="jamini-${{ env.tag }}.zip"
          git archive --format=zip --prefix="jamini-${{ env.tag }}/" --output="${ARCHIVE}" HEAD
          echo "archive=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "Jamini ${{ env.tag }}"
          body: |
            ## Jamini ${{ env.tag }}

            ### Install

            ```bash
            curl -fsSL https://github.com/illdynamics/jamini/releases/download/${{ env.tag }}/jamini-${{ env.tag }}.zip -o jamini.zip
            unzip jamini.zip
            cd jamini-${{ env.tag }}
            ./jamini install
            ```

            ### Or install from the web

            ```bash
            curl -fsSL https://raw.githubusercontent.com/illdynamics/jamini/main/scripts/install.sh | bash
            ```

            ### Quick Start

            ```bash
            export PATH="${HOME}/bin:${PATH}"
            export DEEPSEEK_API_KEY="sk-..."
            jamini --help
            ```

            See [RELEASE-NOTES.md](https://github.com/illdynamics/jamini/blob/main/RELEASE-NOTES.md) for full changelog.
          files: ${{ env.archive }}
          generate_release_notes: false
